name: Validate n8n portfolio workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, static validate and test pure guardrails
        run: npm run check
      - name: Check exported JSON stays in sync with sources
        run: git diff --exit-code -- workflows/safe-agentic-issue-triage.json
